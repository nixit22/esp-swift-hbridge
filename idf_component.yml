    git: "https://github.com/nixit22/esp-swift-mcpwm.git"
  esp-swift-gpio:
    git: "https://github.com/nixit22/esp-swift-gpio.git"
  esp-swift-support:
    git: "https://github.com/nixit22/esp-swift-support.git"
